<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flick Orbits - Hollywood Movies</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:#fff;padding:15px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:28px;color:#e50914}
.header h1 span{color:#fff}
.header p{color:#aaa;margin-top:5px}
.search{width:100%;padding:12px;border-radius:10px;border:none;background:#1e1e2e;color:#fff;margin:15px 0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{background:#1e1e2e;border-radius:12px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover}
.card-body{padding:10px}
.card h3{font-size:14px;margin-bottom:5px}
.card p{font-size:12px;color:#aaa}
.btn{display:block;text-align:center;background:#e50914;color:#fff;padding:10px;margin:10px;border-radius:8px;text-decoration:none;font-weight:bold}
.ad{margin:15px 0;text-align:center;background:#222;padding:10px;border-radius:8px;color:#888;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>FLICK <span>ORBITS</span></h1>
<p>Latest Hollywood Movies 2025-2026</p>
</div>
<input class="search" id="search" placeholder="🔍 Search movies..." onkeyup="filterMovies()">

<div class="ad">--- ADVERTISEMENT ---<br>Your Monetag Ad Here</div>

<div class="grid" id="grid"></div>

<script>
const movies=[
{name:"Avatar: Fire and Ash (2025)",year:"2025",img:"https://image.tmdb.org/t/p/w500/xSgLh8sR8c2u5cDL5o1B8zI8p0o.jpg",link:"https://t.me/HollywoodMovies365Bot"},
{name:"Avengers: Doomsday (2026)",year:"2026",img:"https://image.tmdb.org/t/p/w500/9WJjRj5s1a6X0jvR5Dv3Dv.jpg",link:"https://t.me/HollywoodMovies365Bot"},
{name:"John Wick 5",year:"2026",img:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg",link:"#"},
{name:"The Batman 2",year:"2026",img:"https://image.tmdb.org/t/p/w500/b0PlSFdDwbyK0cf5RxwDpaOJQvQ.jpg",link:"#"},
{name:"Fast X Part 2",year:"2026",img:"https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdghWv.jpg",link:"#"},
{name:"Spider-Man: Brand New Day",year:"2026",img:"https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg",link:"#"},
{name:"Mission Impossible 8",year:"2025",img:"https://image.tmdb.org/t/p/w500/1sQA7lfcF9yUyoLYC0e6Zo3jmxE.jpg",link:"#"},
{name:"Dune: Part Three",year:"2026",img:"https://image.tmdb.org/t/p/w500/cxCmv23O7p3yws2nEdi2jDkM9u.jpg",link:"#"},
];
function render(list){
document.getElementById('grid').innerHTML=list.map(m=>`
<div class="card">
<img src="${m.img}" onerror="this.src='https://via.placeholder.com/300x400?text=${m.name}'">
<div class="card-body"><h3>${m.name}</h3><p>Hollywood • ${m.year} • HD</p></div>
<a class="btn" href="${m.link}">▶ Watch Now</a>
</div>`).join('')
}
function filterMovies(){
let q=document.getElementById('search').value.toLowerCase();
render(movies.filter(m=>m.name.toLowerCase().includes(q)))
}
render(movies)
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
</script>
<!-- PASTE YOUR MONETAG CODE HERE -->
</body>
</html>
